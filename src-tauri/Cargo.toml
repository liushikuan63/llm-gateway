[package]
name = "llm-gateway"
version = "0.1.0"
description = "本地优先的统一 LLM 网关：多 Provider 聚合、协议转换、上下文持久化、失败降级"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "llm_gateway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# 异步运行时
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# HTTP 服务（对外网关）
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# HTTP 客户端（向上游转发）
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "socks",
    "gzip",
    "brotli",
] }

# 流式 SSE 输出（async_stream! 宏）
async-stream = "0.3"

# 存储
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono", "uuid"] }

# 加密
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

# 工具
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
dashmap = "6"
parking_lot = "0.12"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"        # 体积优先，exe 约 9~15MB
panic = "abort"
strip = true
